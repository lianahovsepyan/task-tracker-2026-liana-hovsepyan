<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full-Stack Task Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #f0f2f5; padding: 30px; color: #333; }
    .container { max-width: 650px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
    h1 { font-size: 1.8rem; margin-bottom: 5px; color: #1a202c; }
    p.subtitle { color: #718096; margin-bottom: 25px; font-size: 0.95rem; }
    .form-group { display: flex; gap: 10px; margin-bottom: 25px; }
    input[type="text"] { flex: 1; padding: 12px 15px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 1rem; outline: none; }
    select { padding: 12px; border: 1px solid #e2e8f0; border-radius: 6px; }
    button.add-btn { padding: 12px 20px; background: #3182ce; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button.add-btn:hover { background: #2b6cb0; }
    .task-list { list-style: none; }
    .task-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #edf2f7; }
    .task-item:last-child { border-bottom: none; }
    .task-title { font-weight: 500; }
    .badge { padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; }
    .badge-high { background: #fed7d7; color: #9b2c2c; }
    .badge-medium { background: #feebc8; color: #9c4221; }
    .delete-btn { background: #e53e3e; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Task Tracker (Full-Stack)</h1>
    <p class="subtitle">React & Express Framework Integration - TUMO Labs Station 3</p>

    <div class="form-group">
      <input type="text" id="taskTitle" placeholder="Enter a new task...">
      <select id="taskPriority">
        <option value="High">High</option>
        <option value="Medium" selected>Medium</option>
      </select>
      <button class="add-btn" id="addBtn">Add Task</button>
    </div>

    <ul class="task-list" id="taskList"></ul>
  </div>

  <script>
    const API_URL = 'http://localhost:5000/api/tasks';
    const taskList = document.getElementById('taskList');
    const taskTitle = document.getElementById('taskTitle');
    const taskPriority = document.getElementById('taskPriority');
    const addBtn = document.getElementById('addBtn');

    let tasks = [
      { id: 1, title: 'Learn React & Next.js Frameworks', priority: 'High' },
      { id: 2, title: 'Build Full-Stack Express API', priority: 'High' },
      { id: 3, title: 'Deploy Application to Cloud Framework', priority: 'Medium' }
    ];

    function renderTasks() {
      taskList.innerHTML = '';
      tasks.forEach(task => {
        const li = document.createElement('li');
        li.className = 'task-item';
        li.innerHTML = `
          <div>
            <span class="task-title">${task.title}</span>
            <span class="badge ${task.priority === 'High' ? 'badge-high' : 'badge-medium'}">${task.priority}</span>
          </div>
          <button class="delete-btn" onclick="deleteTask(${task.id})">Delete</button>
        `;
        taskList.appendChild(li);
      });
    }

    addBtn.addEventListener('click', () => {
      const title = taskTitle.value.trim();
      if (!title) return;
      const newTask = { id: Date.now(), title, priority: taskPriority.value };
      tasks.push(newTask);
      taskTitle.value = '';
      renderTasks();
    });

    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      renderTasks();
    }

    renderTasks();
  </script>
</body>
</html>
